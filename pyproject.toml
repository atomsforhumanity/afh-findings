[project]
name = "afh-findings"
version = "0.1.0"
description = "Publish Atoms for Humanity findings: versioned, self-contained result pages with their data, served at findings.afh.org."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.36",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
afh-findings = "afh_findings.cli:main"

[project.urls]
Homepage = "https://findings.afh.org"
Source = "https://github.com/atomsforhumanity/afh-findings"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "boto3-stubs[s3]>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afh_findings"]

[tool.hatch.build.targets.wheel.force-include]
"static/bar.js" = "afh_findings/static/bar.js"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long lines left are messages

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
